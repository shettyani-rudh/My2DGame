<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">Game Panel Tile System Variables</text>
  
  <!-- Original Tile Size Section -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#2563eb">Original Tile Size = 16 pixels</text>
    <rect x="0" y="10" width="16" height="16" fill="#e5e7eb" stroke="#374151" stroke-width="1"/>
    <text x="20" y="22" font-size="12" fill="#666">16x16 px (tiny on modern screens)</text>
  </g>
  
  <!-- Scale Factor -->
  <g transform="translate(50, 120)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#dc2626">Scale = 3</text>
    <text x="0" y="20" font-size="12" fill="#666">Multiplier to make tiles visible</text>
    
    <!-- Arrow showing scaling -->
    <path d="M 20 40 Q 40 30 60 40" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="30" y="35" font-size="10" fill="#dc2626">×3</text>
  </g>
  
  <!-- Scaled Tile Size -->
  <g transform="translate(50, 180)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#059669">Final Tile Size = 48 pixels</text>
    <text x="0" y="20" font-size="12" fill="#666">originalTileSize × scale = 16 × 3 = 48</text>
    <rect x="0" y="30" width="48" height="48" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
    <text x="52" y="55" font-size="12" fill="#666">48x48 px (visible size)</text>
  </g>
  
  <!-- Screen Grid Section -->
  <g transform="translate(400, 60)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#7c3aed">Screen Layout</text>
    
    <!-- Grid representation -->
    <g transform="translate(0, 20)">
      <text x="0" y="0" font-size="12" fill="#666">maxScreenCol = 16, maxScreenRow = 12</text>
      
      <!-- Draw a mini grid to represent the screen -->
      <g transform="translate(0, 20)">
        <!-- Grid lines -->
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d1d5db" stroke-width="1"/>
          </pattern>
        </defs>
        
        <!-- Grid background -->
        <rect width="320" height="240" fill="url(#grid)" stroke="#6b7280" stroke-width="2"/>
        
        <!-- Labels -->
        <text x="160" y="-5" text-anchor="middle" font-size="10" fill="#666">16 columns</text>
        <text x="-15" y="125" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90, -15, 125)">12 rows</text>
        
        <!-- Sample tiles with different colors -->
        <rect x="0" y="0" width="20" height="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
        <rect x="20" y="0" width="20" height="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
        <rect x="40" y="0" width="20" height="20" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
        <rect x="0" y="20" width="20" height="20" fill="#fce7f3" stroke="#ec4899" stroke-width="1"/>
        <rect x="20" y="20" width="20" height="20" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
        
        <!-- Note about scale -->
        <text x="160" y="260" text-anchor="middle" font-size="10" fill="#666">Each square = 1 tile (shown smaller for diagram)</text>
      </g>
    </g>
  </g>
  
  <!-- Final Screen Size Calculation -->
  <g transform="translate(50, 350)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#b45309">Final Screen Dimensions</text>
    
    <g transform="translate(0, 30)">
      <text x="0" y="0" font-size="12" fill="#666">screenWidth = maxScreenCol × tileSize</text>
      <text x="0" y="20" font-size="12" fill="#666">screenWidth = 16 × 48 = 768 pixels</text>
      
      <text x="0" y="50" font-size="12" fill="#666">screenHeight = maxScreenRow × tileSize</text>
      <text x="0" y="70" font-size="12" fill="#666">screenHeight = 12 × 48 = 576 pixels</text>
    </g>
    
    <!-- Screen representation -->
    <g transform="translate(350, 0)">
      <rect width="192" height="144" fill="#f8fafc" stroke="#0f172a" stroke-width="3"/>
      <text x="96" y="75" text-anchor="middle" font-size="14" fill="#334155">Game Screen</text>
      <text x="96" y="95" text-anchor="middle" font-size="12" fill="#64748b">768 × 576 pixels</text>
      <text x="96" y="110" text-anchor="middle" font-size="10" fill="#94a3b8">(4:3 aspect ratio)</text>
      
      <!-- Dimension labels -->
      <text x="96" y="-10" text-anchor="middle" font-size="10" fill="#666">768px</text>
      <text x="-15" y="75" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90, -15, 75)">576px</text>
    </g>
  </g>
  
  <!-- Benefits Box -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="800" height="120" fill="#f0f9ff" stroke="#0369a1" stroke-width="2" rx="5"/>
    <text x="10" y="20" font-size="14" font-weight="bold" fill="#0369a1">Why These Values?</text>
    
    <text x="20" y="40" font-size="12" fill="#1e40af">• 16px original size: Classic retro game standard, efficient for processing</text>
    <text x="20" y="55" font-size="12" fill="#1e40af">• 3x scale: Makes tiny sprites visible on modern high-resolution screens</text>
    <text x="20" y="70" font-size="12" fill="#1e40af">• 16×12 grid: Good balance of visible area vs. tile detail (4:3 aspect ratio)</text>
    <text x="20" y="85" font-size="12" fill="#1e40af">• 768×576 window: Reasonable size for desktop gaming, not too large or small</text>
    <text x="20" y="100" font-size="12" fill="#1e40af">• Grid-based: Easy collision detection, level design, and object positioning</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
</svg>